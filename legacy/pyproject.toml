# The project was published as tplink-modem-mcp until 0.2.0. This empty package keeps that name installable and
# pulls in tplink-modem, which still provides the tplink-modem-mcp command.
[project]
name = "tplink-modem-mcp"
version = "0.3.1"
description = "Renamed to tplink-modem: this package only installs tplink-modem"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["tplink-modem>=0.3.0"]

[project.urls]
Homepage = "https://github.com/YakupEmreYerli/tplink-modem"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
