name: Release legacy name

# Publishes the tplink-modem-mcp package from legacy/, which only depends on tplink-modem.
on:
  push:
    tags: ["legacy-v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing, no API token stored
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME#legacy-v}" = "$(uv version --short --directory legacy)"
      - run: uv build --directory legacy --out-dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
