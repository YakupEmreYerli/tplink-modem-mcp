[project]
name = "tplink-modem"
version = "0.3.0"
description = "Command line and MCP server for TP-Link routers and ISP modems: devices, Wi-Fi signal, logs, presence history, settings"
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["cli", "mcp", "mcp-server", "tp-link", "router", "modem", "archer", "wifi", "home-network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
authors = [
    { name = "Yakup Emre Yerli" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "tplinkrouterc6u>=5.40.0",
]

[project.urls]
Homepage = "https://github.com/YakupEmreYerli/tplink-modem"
Issues = "https://github.com/YakupEmreYerli/tplink-modem/issues"

[project.scripts]
tplink-modem = "tplink_modem.cli:main"
tplink-modem-mcp = "tplink_modem.server:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pytest>=9.2.0",
]
