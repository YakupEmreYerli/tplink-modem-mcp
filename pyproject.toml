[project]
name = "tplink-modem-mcp"
version = "0.1.0"
description = "MCP server for TP-Link routers and ISP modems: devices, Wi-Fi signal, logs, presence history"
readme = "README.md"
license = "MIT"
keywords = ["mcp", "tp-link", "router", "modem", "archer"]
authors = [
    { name = "Yakup Emre Yerli" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "tplinkrouterc6u>=5.40.0",
]

[project.scripts]
tplink-modem-mcp = "tplink_modem_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
